<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://img.sofascore.com https://api.sofascore.app data:; style-src 'self' 'unsafe-inline'">
  <title>Maç Takip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>Maç Takip</div>
    <div class="picker">
      <input id="search" type="text" autocomplete="off" spellcheck="false"
        placeholder="Takım ara veya Sofascore maç linki yapıştır…">
      <div id="dropdown" class="dropdown" hidden></div>
    </div>
    <div class="seg" id="layoutSeg" title="Animasyon yerleşimi">
      <button data-layout="grid" class="on">Izgara</button>
      <button data-layout="free">Serbest</button>
    </div>
    <div class="seg" id="arrangeSeg" title="Izgara dizilimi">
      <button data-arrange="auto" class="on" title="Animasyonları en büyük gösterir; uygun kutularda yan boşluğu kullanır">Oto</button>
      <button data-arrange="row" title="Maçlar yan yana">Yan yana</button>
      <button data-arrange="col" title="Maçlar alt alta">Alt alta</button>
    </div>
    <button id="resetFree" class="btn btn-sm" hidden title="Serbest düzeni ızgaraya göre sıfırla">Düzeni sıfırla</button>
    <div class="topbar-right">
      <div id="update" class="update" hidden>
        <span id="updateText"></span>
        <button id="updateBtn" class="btn btn-primary btn-sm"></button>
        <button id="updateClose" class="icon-btn" title="Şimdilik kapat">✕</button>
      </div>
      <span id="status" class="status"></span>
      <button id="fsBtn" class="icon-btn fs-btn" title="Tam ekran (F)">⛶</button>
      <button id="toggleSide" class="btn btn-sm" title="Şut ekranını aç/kapat">Şut ekranı</button>
    </div>
  </header>

  <main class="layout">
    <section id="grid" class="grid">
      <div id="guideV" class="guide v" hidden></div>
      <div id="guideH" class="guide h" hidden></div>
      <div id="fsHint" class="fs-hint" hidden>Çıkmak için Esc veya F</div>
      <div id="empty" class="empty">
        <div class="empty-icon">📺</div>
        <h2>Henüz maç seçilmedi</h2>
        <p></p>
      </div>
    </section>

    <aside id="side" class="side">
      <div class="side-head">
        <h3>Şut ekranı</h3>
        <button id="addShot" class="btn btn-sm" title="Sadece şut ekranına maç ekle">+ Maç ekle</button>
        <div class="seg" id="periodSeg">
          <button data-period="ALL" class="on">Maç</button>
          <button data-period="1ST">1Y</button>
          <button data-period="2ND">2Y</button>
        </div>
        <div class="cfg-wrap">
          <button id="cardCfgBtn" class="icon-btn cfg-btn" title="Kartta görünecek istatistikler">⚙</button>
          <div id="cardCfg" class="popover" hidden><div class="pop-title">Kartta göster</div></div>
        </div>
      </div>
      <div id="couponBar" class="coupon-bar" hidden></div>
      <div id="shotList" class="shot-list"></div>
      <div class="side-foot"><span>Her 10 sn'de güncellenir</span><span id="appVersion"></span></div>
    </aside>
  </main>

  <template id="tileTpl">
    <article class="tile">
      <div class="tile-head">
        <div class="teams">
          <img class="logo home-logo" alt="">
          <span class="home-name"></span>
          <span class="score">–</span>
          <span class="away-name"></span>
          <img class="logo away-logo" alt="">
        </div>
        <span class="minute"></span>
        <button class="icon-btn reset-btn" title="Bu maçı yenile (veriyi ve animasyonu baştan yükle)">↻</button>
        <button class="icon-btn focus-btn" title="Odak modu: bu maçı büyüt">⤢</button>
        <button class="icon-btn to-shot" title="Animasyonu kapat (sadece şut ekranında kalsın)">▭</button>
        <button class="icon-btn close" title="Maçı kaldır">✕</button>
      </div>
      <div class="stage">
        <div class="placeholder"></div>
        <div class="goal-overlay" role="status" aria-live="polite" aria-atomic="true">
          <div class="goal-overlay-content">
            <div class="goal-overlay-word">GOOOOOOOOOOOOL</div>
            <span class="goal-overlay-team"></span>
            <strong class="goal-overlay-score" aria-label="Maç skoru"></strong>
          </div>
        </div>
      </div>
      <div class="tile-foot">
        <span>Şut <b class="shots">–</b></span>
        <span>İsabetli <b class="sot">–</b></span>
        <span>Korner <b class="corners">–</b></span>
        <span class="src"></span>
      </div>
      <div class="alert-badge"></div>
      <div class="rh n" data-dir="n"></div>
      <div class="rh s" data-dir="s"></div>
      <div class="rh e" data-dir="e"></div>
      <div class="rh w" data-dir="w"></div>
      <div class="rh nw" data-dir="nw"></div>
      <div class="rh ne" data-dir="ne"></div>
      <div class="rh sw" data-dir="sw"></div>
      <div class="rh se" data-dir="se" title="Boyutlandır"></div>
    </article>
  </template>

  <script src="js/core.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/players.js"></script>
  <script src="js/coupon.js"></script>
  <script src="js/shots.js"></script>
  <script src="js/alerts.js"></script>
  <script src="app.js"></script>
</body>
</html>
