<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Gol</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
      font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { position: absolute; inset: 8px; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      background: #0e141b; border: 1px solid #273443; border-left: 5px solid #1fd67a; border-radius: 14px; color: #edf3f8;
      box-shadow: 0 10px 30px rgba(0,0,0,.45); cursor: pointer; transform: translateX(120%); transition: transform .35s cubic-bezier(.2,.9,.3,1.15); }
    .card.show { transform: none; }
    .ball { font-size: 30px; }
    .txt { min-width: 0; flex: 1; }
    .t { font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .04em; color: #1fd67a; }
    .b { color: #c9d4df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .x { position: absolute; top: 6px; right: 10px; color: #8392a3; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card" id="card"><div class="ball">⚽</div><div class="txt"><div class="t" id="t"></div><div class="b" id="b"></div></div><span class="x">✕</span></div>
  <script src="toast.js"></script>
</body>
</html>
